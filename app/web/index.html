<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1029" />
    <meta
      name="description"
      content="Simplify sales, inventory, suppliers, billing, and customer insights with a modern POS system built for local shops and growing retail businesses."
    />
    <meta
      name="keywords"
      content="POS software, point of sale system, retail POS, inventory management, sales tracking, supplier management, billing software, business management software"
    />
    <meta name="author" content="POS" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="application-name" content="POS" />
    <meta name="apple-mobile-web-app-title" content="POS" />
    <meta name="thumbnail" content="/social-preview.png" />

    <meta itemprop="name" content="POS - Point of Sale" />
    <meta
      itemprop="description"
      content="Simplify sales, inventory, suppliers, billing, and customer insights with a modern POS system built for local shops and growing retail businesses."
    />
    <meta itemprop="image" content="/social-preview.png" />

    <meta property="og:locale" content="en_US" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="POS" />
    <meta property="og:title" content="POS - Point of Sale" />
    <meta
      property="og:description"
      content="Simplify sales, inventory, suppliers, billing, and customer insights with a modern POS system built for local shops and growing retail businesses."
    />
    <meta property="og:url" content="/" />
    <meta property="og:image" content="/social-preview.png" />
    <meta property="og:image:secure_url" content="/social-preview.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1896" />
    <meta property="og:image:height" content="901" />
    <meta
      property="og:image:alt"
      content="POS dashboard preview for sales, inventory, and store management."
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="POS - Point of Sale" />
    <meta
      name="twitter:description"
      content="Simplify sales, inventory, suppliers, billing, and customer insights with a modern POS system built for local shops and growing retail businesses."
    />
    <meta name="twitter:url" content="/" />
    <meta name="twitter:image" content="/social-preview.png" />
    <meta
      name="twitter:image:alt"
      content="POS dashboard preview for sales, inventory, and store management."
    />

    <title>POS - Point of Sale</title>
    <script>
      const absoluteUrl = `${window.location.origin}${window.location.pathname}`;
      const absoluteImageUrl = `${window.location.origin}/social-preview.png`;
      const ensureLink = (rel) => {
        let element = document.querySelector(`link[rel="${rel}"]`);

        if (!element) {
          element = document.createElement("link");
          element.setAttribute("rel", rel);
          document.head.appendChild(element);
        }

        return element;
      };

      ensureLink("canonical").setAttribute("href", absoluteUrl);
      ensureLink("image_src").setAttribute("href", absoluteImageUrl);

      document
        .querySelector('meta[property="og:url"]')
        ?.setAttribute("content", absoluteUrl);
      document
        .querySelector('meta[property="og:image"]')
        ?.setAttribute("content", absoluteImageUrl);
      document
        .querySelector('meta[property="og:image:secure_url"]')
        ?.setAttribute("content", absoluteImageUrl);
      document
        .querySelector('meta[name="twitter:url"]')
        ?.setAttribute("content", absoluteUrl);
      document
        .querySelector('meta[name="twitter:image"]')
        ?.setAttribute("content", absoluteImageUrl);
      document
        .querySelector('meta[itemprop="image"]')
        ?.setAttribute("content", absoluteImageUrl);
      document
        .querySelector('meta[name="thumbnail"]')
        ?.setAttribute("content", absoluteImageUrl);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
