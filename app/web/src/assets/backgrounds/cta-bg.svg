<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" fill="none">
  <!-- CTA Background: Abstract waves and geometric shapes for Connect/CTA section -->
  <defs>
    <linearGradient id="ctaGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a131d"/>
      <stop offset="50%" stop-color="#0f2322"/>
      <stop offset="100%" stop-color="#0a131d"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4fe7c4" stop-opacity="0"/>
      <stop offset="50%" stop-color="#4fe7c4" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#4fe7c4" stop-opacity="0"/>
    </linearGradient>
  </defs>
  
  <!-- Base fill -->
  <rect width="800" height="400" fill="url(#ctaGrad)"/>
  
  <!-- Wave 1 -->
  <path d="M0 300 Q200 250 400 280 Q600 310 800 260 L800 400 L0 400Z" fill="#4fe7c4" opacity="0.04"/>
  
  <!-- Wave 2 -->
  <path d="M0 320 Q150 280 350 310 Q550 340 800 290 L800 400 L0 400Z" fill="#4fe7c4" opacity="0.06"/>
  
  <!-- Wave 3 (top) -->
  <path d="M0 80 Q200 120 400 90 Q600 60 800 100 L800 0 L0 0Z" fill="#4fe7c4" opacity="0.03"/>
  
  <!-- Glowing orbs -->
  <circle cx="200" cy="180" r="80" fill="#4fe7c4" opacity="0.05"/>
  <circle cx="600" cy="220" r="100" fill="#4fe7c4" opacity="0.04"/>
  <circle cx="400" cy="100" r="60" fill="#69fec1" opacity="0.03"/>
  
  <!-- Horizontal accent lines -->
  <line x1="100" y1="150" x2="300" y2="150" stroke="#4fe7c4" stroke-width="0.5" opacity="0.1"/>
  <line x1="500" y1="250" x2="700" y2="250" stroke="#4fe7c4" stroke-width="0.5" opacity="0.08"/>
  
  <!-- Decorative dots -->
  <circle cx="150" cy="100" r="2" fill="#4fe7c4" opacity="0.15"/>
  <circle cx="350" cy="180" r="2" fill="#4fe7c4" opacity="0.12"/>
  <circle cx="650" cy="140" r="2" fill="#4fe7c4" opacity="0.1"/>
  <circle cx="450" cy="300" r="2" fill="#4fe7c4" opacity="0.08"/>
  
  <!-- Corner geometric shapes -->
  <polygon points="50,50 70,30 90,50 70,70" stroke="#4fe7c4" stroke-width="0.5" fill="none" opacity="0.08"/>
  <polygon points="720,340 740,320 760,340 740,360" stroke="#4fe7c4" stroke-width="0.5" fill="none" opacity="0.06"/>
</svg>
