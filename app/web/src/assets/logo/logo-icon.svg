<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- Shopping bag icon with barcode - Square version for favicon/icon -->
  <g transform="translate(5, 2)">
    <!-- Bag body -->
    <rect x="2" y="14" width="34" height="30" rx="4" fill="#144443" stroke="#4fe7c4" stroke-width="1.8"/>
    <!-- Bag handle -->
    <path d="M11 14V10a8 8 0 0 1 16 0v4" stroke="#4fe7c4" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <!-- Barcode lines -->
    <line x1="10" y1="23" x2="10" y2="36" stroke="#4fe7c4" stroke-width="1.5" opacity="0.7"/>
    <line x1="14" y1="23" x2="14" y2="36" stroke="#4fe7c4" stroke-width="2.2" opacity="0.85"/>
    <line x1="18" y1="23" x2="18" y2="36" stroke="#4fe7c4" stroke-width="1.2" opacity="0.6"/>
    <line x1="21.5" y1="23" x2="21.5" y2="36" stroke="#4fe7c4" stroke-width="1.8" opacity="0.75"/>
    <line x1="25" y1="23" x2="25" y2="36" stroke="#4fe7c4" stroke-width="2.5" opacity="0.9"/>
    <line x1="29" y1="23" x2="29" y2="36" stroke="#4fe7c4" stroke-width="1.2" opacity="0.65"/>
    <!-- Accent dot -->
    <circle cx="19" cy="6.5" r="2" fill="#4fe7c4" opacity="0.9"/>
  </g>
</svg>
