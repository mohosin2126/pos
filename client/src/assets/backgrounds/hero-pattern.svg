<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" fill="none">
  <!-- Hero pattern: Circuit-board / tech grid with POS theme -->
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <!-- Grid dots -->
      <circle cx="30" cy="30" r="1.5" fill="#4fe7c4" opacity="0.12"/>
      <circle cx="0" cy="0" r="1" fill="#4fe7c4" opacity="0.08"/>
      <circle cx="60" cy="0" r="1" fill="#4fe7c4" opacity="0.08"/>
      <circle cx="0" cy="60" r="1" fill="#4fe7c4" opacity="0.08"/>
      <circle cx="60" cy="60" r="1" fill="#4fe7c4" opacity="0.08"/>
      <!-- Thin grid lines -->
      <line x1="30" y1="0" x2="30" y2="60" stroke="#4fe7c4" stroke-width="0.3" opacity="0.06"/>
      <line x1="0" y1="30" x2="60" y2="30" stroke="#4fe7c4" stroke-width="0.3" opacity="0.06"/>
    </pattern>
    <radialGradient id="fade" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="white" stop-opacity="1"/>
      <stop offset="70%" stop-color="white" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
    <mask id="fadeMask">
      <rect width="800" height="800" fill="url(#fade)"/>
    </mask>
  </defs>
  
  <!-- Base grid -->
  <rect width="800" height="800" fill="url(#grid)" mask="url(#fadeMask)"/>
  
  <!-- Decorative circuit paths -->
  <path d="M100 200 L200 200 L200 300 L350 300" stroke="#4fe7c4" stroke-width="0.8" fill="none" opacity="0.1"/>
  <path d="M500 100 L500 250 L650 250 L650 400" stroke="#4fe7c4" stroke-width="0.8" fill="none" opacity="0.08"/>
  <path d="M300 500 L400 500 L400 650 L550 650" stroke="#4fe7c4" stroke-width="0.8" fill="none" opacity="0.07"/>
  
  <!-- Circuit nodes -->
  <circle cx="200" cy="200" r="4" fill="#4fe7c4" opacity="0.15"/>
  <circle cx="200" cy="300" r="3" fill="#4fe7c4" opacity="0.1"/>
  <circle cx="350" cy="300" r="4" fill="#4fe7c4" opacity="0.12"/>
  <circle cx="500" cy="250" r="3" fill="#4fe7c4" opacity="0.1"/>
  <circle cx="650" cy="250" r="4" fill="#4fe7c4" opacity="0.08"/>
  <circle cx="400" cy="500" r="3" fill="#4fe7c4" opacity="0.1"/>
  
  <!-- Floating barcode-like elements -->
  <g opacity="0.06" transform="translate(600, 150)">
    <rect x="0" y="0" width="2" height="30" fill="#4fe7c4"/>
    <rect x="5" y="0" width="4" height="30" fill="#4fe7c4"/>
    <rect x="12" y="0" width="2" height="30" fill="#4fe7c4"/>
    <rect x="16" y="0" width="3" height="30" fill="#4fe7c4"/>
    <rect x="22" y="0" width="4" height="30" fill="#4fe7c4"/>
    <rect x="28" y="0" width="2" height="30" fill="#4fe7c4"/>
  </g>
  
  <g opacity="0.05" transform="translate(120, 500)">
    <rect x="0" y="0" width="3" height="25" fill="#4fe7c4"/>
    <rect x="6" y="0" width="2" height="25" fill="#4fe7c4"/>
    <rect x="10" y="0" width="4" height="25" fill="#4fe7c4"/>
    <rect x="17" y="0" width="2" height="25" fill="#4fe7c4"/>
    <rect x="22" y="0" width="3" height="25" fill="#4fe7c4"/>
  </g>
  
  <!-- Hexagonal accents -->
  <polygon points="400,80 420,90 420,110 400,120 380,110 380,90" stroke="#4fe7c4" stroke-width="0.5" fill="none" opacity="0.08"/>
  <polygon points="150,400 170,410 170,430 150,440 130,430 130,410" stroke="#4fe7c4" stroke-width="0.5" fill="none" opacity="0.06"/>
  <polygon points="680,500 700,510 700,530 680,540 660,530 660,510" stroke="#4fe7c4" stroke-width="0.5" fill="none" opacity="0.05"/>
</svg>
