<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Payments & Billing illustration -->
  <!-- Credit card -->
  <rect x="6" y="14" width="40" height="26" rx="4" fill="#144443" stroke="#4fe7c4" stroke-width="1.5"/>
  <!-- Card stripe -->
  <rect x="6" y="21" width="40" height="5" fill="#4fe7c4" opacity="0.3"/>
  <!-- Card chip -->
  <rect x="12" y="28" width="8" height="6" rx="1.5" fill="#4fe7c4" opacity="0.7" stroke="#69fec1" stroke-width="0.5"/>
  <line x1="14" y1="29.5" x2="14" y2="32.5" stroke="#0f2322" stroke-width="0.5"/>
  <line x1="16" y1="29.5" x2="16" y2="32.5" stroke="#0f2322" stroke-width="0.5"/>
  <line x1="18" y1="29.5" x2="18" y2="32.5" stroke="#0f2322" stroke-width="0.5"/>
  <!-- Card number dots -->
  <circle cx="12" cy="36" r="1" fill="#4fe7c4" opacity="0.5"/>
  <circle cx="15" cy="36" r="1" fill="#4fe7c4" opacity="0.5"/>
  <circle cx="18" cy="36" r="1" fill="#4fe7c4" opacity="0.5"/>
  <circle cx="21" cy="36" r="1" fill="#4fe7c4" opacity="0.5"/>
  <circle cx="26" cy="36" r="1" fill="#4fe7c4" opacity="0.3"/>
  <circle cx="29" cy="36" r="1" fill="#4fe7c4" opacity="0.3"/>
  <circle cx="32" cy="36" r="1" fill="#4fe7c4" opacity="0.3"/>
  <circle cx="35" cy="36" r="1" fill="#4fe7c4" opacity="0.3"/>
  <!-- Floating dollar coin -->
  <circle cx="50" cy="20" r="10" fill="#0f2322" stroke="#4fe7c4" stroke-width="1.5"/>
  <circle cx="50" cy="20" r="7" fill="#144443" stroke="#4fe7c4" stroke-width="1"/>
  <text x="47" y="24" font-family="Outfit, sans-serif" font-size="11" font-weight="700" fill="#4fe7c4">$</text>
  <!-- Invoice receipt -->
  <rect x="42" y="34" width="18" height="22" rx="2" fill="#0f2322" stroke="#4fe7c4" stroke-width="1.2"/>
  <line x1="45" y1="39" x2="57" y2="39" stroke="#4fe7c4" stroke-width="0.8" opacity="0.5"/>
  <line x1="45" y1="42" x2="55" y2="42" stroke="#4fe7c4" stroke-width="0.8" opacity="0.4"/>
  <line x1="45" y1="45" x2="56" y2="45" stroke="#4fe7c4" stroke-width="0.8" opacity="0.3"/>
  <line x1="45" y1="50" x2="57" y2="50" stroke="#4fe7c4" stroke-width="1" opacity="0.6"/>
  <!-- Checkmark -->
  <circle cx="10" cy="50" r="7" fill="#4fe7c4" opacity="0.15"/>
  <polyline points="6,50 9,53 14,47" stroke="#4fe7c4" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
