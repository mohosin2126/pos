<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Sales Dashboard illustration -->
  <!-- Monitor frame -->
  <rect x="8" y="8" width="48" height="34" rx="4" fill="#0f2322" stroke="#4fe7c4" stroke-width="1.5"/>
  <!-- Screen content - bar chart -->
  <rect x="15" y="26" width="6" height="10" rx="1" fill="#4fe7c4" opacity="0.4"/>
  <rect x="23" y="20" width="6" height="16" rx="1" fill="#4fe7c4" opacity="0.6"/>
  <rect x="31" y="14" width="6" height="22" rx="1" fill="#4fe7c4" opacity="0.8"/>
  <rect x="39" y="18" width="6" height="18" rx="1" fill="#4fe7c4"/>
  <!-- Trend line -->
  <polyline points="18,28 26,22 34,16 42,19" stroke="#69fec1" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Arrow up -->
  <path d="M47 14l-3-3 3-3" stroke="#69fec1" stroke-width="1.2" fill="none" stroke-linecap="round" transform="rotate(-90, 47, 14)"/>
  <!-- Monitor stand -->
  <rect x="27" y="42" width="10" height="3" rx="1" fill="#144443"/>
  <rect x="24" y="45" width="16" height="2" rx="1" fill="#144443" stroke="#4fe7c4" stroke-width="0.8"/>
  <!-- Decorative dots -->
  <circle cx="12" cy="12" r="1.5" fill="#4fe7c4" opacity="0.5"/>
  <circle cx="16" cy="12" r="1.5" fill="#69fec1" opacity="0.3"/>
</svg>
